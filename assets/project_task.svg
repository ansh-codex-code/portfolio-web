<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#161922" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1e29" />
      <stop offset="100%" stop-color="#141720" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="450" rx="12" fill="url(#bgGrad)" />
  
  <!-- Window Bar -->
  <rect width="800" height="38" rx="12" fill="#12151c" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="400" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle" font-weight="500">TaskFlow — Sprint Board 24</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="160" height="412" fill="#10131a" />
  <rect x="18" y="58" width="124" height="28" rx="6" fill="#f97316" fill-opacity="0.15" />
  <text x="32" y="76" fill="#f97316" font-family="sans-serif" font-size="12" font-weight="600">⚡ Active Sprint</text>
  <text x="32" y="114" fill="#94a3b8" font-family="sans-serif" font-size="12">📋 Backlog (32)</text>
  <text x="32" y="146" fill="#94a3b8" font-family="sans-serif" font-size="12">🎯 Milestones</text>
  <text x="32" y="178" fill="#94a3b8" font-family="sans-serif" font-size="12">👥 Team Members</text>
  <text x="32" y="210" fill="#94a3b8" font-family="sans-serif" font-size="12">⚙️ Workspace Settings</text>

  <!-- Board Columns -->
  <!-- Col 1: Todo -->
  <rect x="180" y="58" width="186" height="370" rx="8" fill="#13161f" />
  <text x="195" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">To Do</text>
  <circle cx="345" cy="78" r="10" fill="#334155" />
  <text x="345" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">4</text>

  <!-- Card 1 -->
  <rect x="192" y="100" width="162" height="90" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.75" />
  <rect x="204" y="112" width="54" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2" />
  <text x="231" y="125" fill="#60a5fa" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">DESIGN</text>
  <text x="204" y="148" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="500">Design System V2</text>
  <circle cx="334" cy="172" r="9" fill="#f59e0b" />
  <text x="334" y="175" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">AV</text>

  <!-- Card 2 -->
  <rect x="192" y="202" width="162" height="85" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.75" />
  <rect x="204" y="214" width="56" height="18" rx="4" fill="#ec4899" fill-opacity="0.2" />
  <text x="232" y="227" fill="#f472b6" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">FRONTEND</text>
  <text x="204" y="250" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="500">Audit Accessibility</text>

  <!-- Col 2: In Progress -->
  <rect x="384" y="58" width="186" height="370" rx="8" fill="#13161f" />
  <text x="399" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">In Progress</text>
  <circle cx="549" cy="78" r="10" fill="#f97316" fill-opacity="0.3" />
  <text x="549" y="82" fill="#f97316" font-family="sans-serif" font-size="10" text-anchor="middle">2</text>

  <!-- Card 3 -->
  <rect x="396" y="100" width="162" height="105" rx="6" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1.2" />
  <rect x="408" y="112" width="60" height="18" rx="4" fill="#f97316" fill-opacity="0.2" />
  <text x="438" y="125" fill="#fb923c" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">BACKEND</text>
  <text x="408" y="148" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">GraphQL Migration</text>
  <rect x="408" y="165" width="138" height="5" rx="2.5" fill="#2d3748" />
  <rect x="408" y="165" width="96" height="5" rx="2.5" fill="url(#orangeGrad)" />
  <text x="408" y="188" fill="#94a3b8" font-family="sans-serif" font-size="10">68% completed</text>

  <!-- Col 3: Done -->
  <rect x="588" y="58" width="194" height="370" rx="8" fill="#13161f" />
  <text x="603" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Completed</text>
  <circle cx="762" cy="78" r="10" fill="#10b981" fill-opacity="0.3" />
  <text x="762" y="82" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">8</text>

  <!-- Card 4 -->
  <rect x="600" y="100" width="170" height="90" rx="6" fill="url(#cardGrad)" stroke="#10b981" stroke-width="0.75" />
  <rect x="612" y="112" width="56" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
  <text x="640" y="125" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">RELEASE</text>
  <text x="612" y="148" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="500">Stripe Billing V3</text>
  <text x="612" y="172" fill="#64748b" font-family="sans-serif" font-size="10">✓ Deployed to Prod</text>
</svg>
